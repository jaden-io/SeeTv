<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Watch — SeeTv</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest/dist/hls.min.js"></script>
<link rel="stylesheet" href="/public/css/globals.css">
<style>
body{background:#000;overflow-x:hidden}.watch{padding-top:64px;min-height:100vh}.player{position:relative;width:100%;background:#000;min-height:56.25vw;max-height:82vh}.player video{width:100%;height:100%;min-height:56.25vw;max-height:82vh;display:block;object-fit:contain;background:#000}.overlay{position:absolute;inset:0;z-index:2;display:flex;align-items:center;justify-content:center;background:#000;transition:opacity .35s}.overlay.hidden{opacity:0;pointer-events:none}.loader{text-align:center;position:relative;z-index:2}.loader h1{font-family:var(--font-display);font-size:clamp(1.2rem,3vw,2rem);margin:18px 0 8px}.loader p{color:var(--text-1);font-size:.85rem}.loader-bar{width:220px;height:3px;background:#222;margin:18px auto 0;overflow:hidden;border-radius:4px}.loader-bar i{display:block;height:100%;width:45%;background:#e50914;animation:load 1.4s infinite ease-in-out}@keyframes load{0%{transform:translateX(-130%)}100%{transform:translateX(500%)}}.error{position:absolute;inset:0;z-index:3;display:none;align-items:center;justify-content:center;text-align:center;background:radial-gradient(circle at center,#180304 0,#050505 55%,#000 100%);padding:24px}.error.open{display:flex}.error-box{max-width:560px}.error-icon{font-size:42px;color:#e50914}.error h2{font-family:var(--font-display);font-size:2.1rem;margin:12px 0}.error p{color:#aaa;line-height:1.6}.error-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:22px}.watch-info{padding:32px;max-width:1200px;margin:auto}.info-grid{display:flex;gap:28px}.poster{width:150px;flex:0 0 150px}.poster img{width:100%;border-radius:10px}.meta{color:#999;font-size:.9rem;margin:8px 0 16px}.overview{color:#ccc;line-height:1.7;max-width:800px}.red{color:#e50914}@media(max-width:700px){.info-grid{display:block}.poster{width:110px}.watch-info{padding:22px 16px}}
</style>
</head>
<body>
<nav class="nav"><a href="/" class="nav-logo">SEE<span>TV</span></a><div class="nav-links"><a href="/" class="nav-link">Home</a><a href="/browse?type=movie" class="nav-link">Movies</a><a href="/browse?type=tv" class="nav-link">TV Shows</a></div></nav>
<div class="watch">
<section class="player" id="player"><video id="video" controls autoplay playsinline preload="auto"></video><div class="overlay" id="overlay"><div class="loader"><div class="spinner"></div><h1 id="status-title">Loading stream...</h1><p id="status">Connecting to stream provider</p><div class="loader-bar"><i></i></div></div></div><div class="error" id="error"><div class="error-box"><div class="error-icon">▶</div><h2>Stream unavailable</h2><p id="error-message">The stream provider did not return a playable video.</p><div class="error-actions"><button class="btn btn-primary" onclick="retry()">Try Again</button><a class="btn btn-ghost" href="/">Back Home</a></div></div></div></section>
<section class="watch-info" id="info"><div class="info-grid"><div class="poster skeleton" id="poster"></div><div><h1 id="title" class="section-title">Loading...</h1><div id="meta" class="meta"></div><p id="overview" class="overview"></p></div></div></section>
</div>
<script src="/public/js/config.js"></script>
<script>
const params=new URLSearchParams(location.search),id=params.get('id'),season=params.get('s')||params.get('season'),episode=params.get('e')||params.get('episode')||'1',isTv=!!season;
let hls=null,loading=false,msgTimer;const messages=['Connecting to stream provider','Generating secure stream token','Resolving HLS playlist','Preparing video player','Almost ready'];
function setStatus(t){document.getElementById('status').textContent=t}
function showError(msg){clearInterval(msgTimer);document.getElementById('overlay').classList.add('hidden');document.getElementById('error').classList.add('open');document.getElementById('error-message').textContent=msg||'Unable to load this stream.'}
function showPlayer(){clearInterval(msgTimer);document.getElementById('overlay').classList.add('hidden')}
function retry(){document.getElementById('error').classList.remove('open');document.getElementById('overlay').classList.remove('hidden');loadStream()}
async function loadInfo(){if(!id||!window.CONFIG?.TMDB_KEY)return;try{const endpoint=isTv?`/api/tv/${id}`:`/api/movie/${id}`,r=await fetch(endpoint+'?tmdb_key='+encodeURIComponent(CONFIG.TMDB_KEY)),j=await r.json();if(!j.success)return;const d=j.data||{};const title=d.title||d.name||'';document.title=(title?'Watch '+title+' — ':'')+'SeeTv';document.getElementById('title').textContent=title;const year=(d.release_date||d.first_air_date||'').slice(0,4);document.getElementById('meta').textContent=[year,d.vote_average?'★ '+Number(d.vote_average).toFixed(1):'',isTv?`Season ${season} · Episode ${episode}`:''].filter(Boolean).join('  •  ');document.getElementById('overview').textContent=d.overview||'';if(d.poster_path)document.getElementById('poster').innerHTML='<img src="https://image.tmdb.org/t/p/w342'+d.poster_path+'" alt="">'}catch(e){}}
async function resolveStream(){if(!id)throw new Error('No movie or show ID was provided.');const q=new URLSearchParams({id});if(isTv){q.set('s',season);q.set('e',episode)}const r=await fetch('/api?'+q.toString(),{cache:'no-store'});let j;try{j=await r.json()}catch(e){throw new Error('Stream API returned invalid JSON (HTTP '+r.status+').')}if(!r.ok||j.success===false)throw new Error(j.error||'Stream API failed (HTTP '+r.status+').');const data=j.data||j,url=data.url||data.stream_url;if(!url||typeof url!=='string')throw new Error(data.stream_error||'Stream provider returned no playable playlist.');return url}
function play(url){const video=document.getElementById('video');if(hls){hls.destroy();hls=null}const source='/api/proxy?url='+encodeURIComponent(url);if(window.Hls&&Hls.isSupported()){hls=new Hls({enableWorker:true,lowLatencyMode:false,maxBufferLength:30,maxMaxBufferLength:60,backBufferLength:30});hls.attachMedia(video);hls.loadSource(source);hls.on(Hls.Events.MANIFEST_PARSED,()=>{showPlayer();video.play().catch(()=>{})});hls.on(Hls.Events.ERROR,(_,d)=>{if(d.fatal){try{hls.destroy()}catch(e){}showError('Video playlist failed: '+(d.details||'HLS error'))}})}else if(video.canPlayType('application/vnd.apple.mpegurl')){video.src=source;video.addEventListener('loadedmetadata',()=>{showPlayer();video.play().catch(()=>{})},{once:true});video.addEventListener('error',()=>showError('The browser could not play the HLS stream.'),{once:true})}else showError('HLS playback is not supported by this browser.')}
async function loadStream(){if(loading)return;loading=true;let i=0;clearInterval(msgTimer);setStatus(messages[0]);msgTimer=setInterval(()=>setStatus(messages[++i%messages.length]),1800);try{const url=await resolveStream();play(url)}catch(e){showError(e.message)}finally{loading=false}}
loadInfo();loadStream();
</script>
</body>
</html>
