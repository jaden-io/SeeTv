<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Analytics — StreamVault</title>
<link rel="stylesheet" href="/public/css/globals.css">
<style>
.analytics-wrap { padding-top: 96px; padding-bottom: 60px; }

.analytics-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 32px;
  flex-wrap: wrap;
  gap: 16px;
}

.analytics-title { font-family: var(--font-display); font-size: 2rem; letter-spacing: .04em; }

.live-dot {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: .8rem;
  color: var(--green);
  font-weight: 600;
}

.live-pulse {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--green);
  animation: pulse 1.5s infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: .5; transform: scale(1.3); }
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 16px;
  margin-bottom: 32px;
}

.stat-card {
  padding: 24px;
  background: var(--bg-1);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  transition: border-color var(--transition);
}

.stat-card:hover { border-color: rgba(255,255,255,.12); }

.stat-label {
  font-size: .72rem;
  font-weight: 700;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--text-2);
  margin-bottom: 8px;
}

.stat-value {
  font-family: var(--font-display);
  font-size: 2.5rem;
  letter-spacing: .02em;
  line-height: 1;
  color: var(--text-0);
  margin-bottom: 4px;
}

.stat-sublabel { font-size: .75rem; color: var(--text-2); }

.section-card {
  background: var(--bg-1);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 24px;
  margin-bottom: 16px;
}

.section-card-title {
  font-family: var(--font-display);
  font-size: 1.2rem;
  letter-spacing: .04em;
  margin-bottom: 20px;
}

.endpoint-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 0;
  border-bottom: 1px solid var(--border);
  font-size: .875rem;
}

.endpoint-row:last-child { border-bottom: none; }

.endpoint-name { font-family: monospace; color: var(--accent); }
.endpoint-count { font-weight: 700; color: var(--text-0); }
.endpoint-bar-wrap { flex: 1; margin: 0 16px; height: 4px; background: var(--bg-3); border-radius: 2px; overflow: hidden; }
.endpoint-bar { height: 100%; background: var(--accent); border-radius: 2px; transition: width 0.5s ease; }

.health-row {
  display: flex;
  gap: 12px;
  align-items: center;
  padding: 12px 0;
  border-bottom: 1px solid var(--border);
  font-size: .875rem;
}

.health-row:last-child { border-bottom: none; }
.health-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.health-dot.ok  { background: var(--green); }
.health-dot.warn { background: var(--accent); }
.health-dot.err { background: var(--red); }
.health-key { color: var(--text-1); }
.health-val { margin-left: auto; font-weight: 600; color: var(--text-0); }

.refresh-info { font-size: .75rem; color: var(--text-2); margin-top: 16px; }
</style>
</head>
<body>

<nav class="nav">
  <a href="/" class="nav-logo">STREAM<span>VAULT</span></a>
  <div class="nav-links">
    <a href="/" class="nav-link">Home</a>
    <a href="/browse" class="nav-link">Browse</a>
    <a href="/docs" class="nav-link">API Docs</a>
    <a href="/analytics" class="nav-link active">Analytics</a>
  </div>
</nav>

<div class="page-wrap analytics-wrap">
  <div class="analytics-header">
    <h1 class="analytics-title">Analytics</h1>
    <div class="live-dot"><div class="live-pulse"></div>Live</div>
  </div>

  <div class="stats-grid" id="stats-grid">
    <div class="stat-card skeleton" style="height:100px"></div>
    <div class="stat-card skeleton" style="height:100px"></div>
    <div class="stat-card skeleton" style="height:100px"></div>
    <div class="stat-card skeleton" style="height:100px"></div>
    <div class="stat-card skeleton" style="height:100px"></div>
  </div>

  <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px" id="lower-grid">
    <div class="section-card">
      <div class="section-card-title">Endpoint Hits</div>
      <div id="endpoint-rows"><div class="skeleton" style="height:160px"></div></div>
    </div>
    <div class="section-card">
      <div class="section-card-title">System Health</div>
      <div id="health-rows"><div class="skeleton" style="height:160px"></div></div>
    </div>
  </div>

  <p class="refresh-info" id="refresh-info">Refreshes every 5 seconds</p>
</div>

<script>
async function fetchAndRender() {
  try {
    const res  = await fetch('/api/analytics');
    const json = await res.json();
    if (!json.success) return;
    const d = json.data;
    renderStats(d);
    renderEndpoints(d.endpoints || {});
    renderHealth(d);
    document.getElementById('refresh-info').textContent = 'Last updated: ' + new Date().toLocaleTimeString();
  } catch (e) {
    document.getElementById('refresh-info').textContent = 'Error fetching analytics: ' + e.message;
  }
}

function renderStats(d) {
  const uptime   = d.uptime_seconds || 0;
  const hours    = Math.floor(uptime / 3600);
  const mins     = Math.floor((uptime % 3600) / 60);
  const uptimeStr = hours > 0 ? `${hours}h ${mins}m` : `${mins}m`;

  document.getElementById('stats-grid').innerHTML = `
    ${statCard('Total Requests', d.requests || 0, 'since start')}
    ${statCard('Streams Resolved', d.streams || 0, 'successful')}
    ${statCard('TMDB API Hits', d.tmdbHits || 0, 'fetched')}
    ${statCard('Proxied Segments', d.proxied || 0, 'relayed')}
    ${statCard('Success Rate', d.success_rate || '—', 'error-free')}
    ${statCard('Uptime', uptimeStr, 'running')}
  `;
}

function statCard(label, value, sub) {
  return `
    <div class="stat-card">
      <div class="stat-label">${label}</div>
      <div class="stat-value">${value}</div>
      <div class="stat-sublabel">${sub}</div>
    </div>
  `;
}

function renderEndpoints(eps) {
  const sorted = Object.entries(eps).sort((a, b) => b[1] - a[1]);
  const max    = sorted[0]?.[1] || 1;
  document.getElementById('endpoint-rows').innerHTML = sorted.length
    ? sorted.map(([name, count]) => `
        <div class="endpoint-row">
          <span class="endpoint-name">${name}</span>
          <div class="endpoint-bar-wrap"><div class="endpoint-bar" style="width:${(count/max*100).toFixed(1)}%"></div></div>
          <span class="endpoint-count">${count}</span>
        </div>
      `).join('')
    : '<p style="color:var(--text-2);font-size:.875rem">No requests yet.</p>';
}

function renderHealth(d) {
  const wasmOk = d.wasm_ready;
  document.getElementById('health-rows').innerHTML = `
    <div class="health-row">
      <div class="health-dot ${wasmOk ? 'ok' : 'err'}"></div>
      <span class="health-key">WASM Module</span>
      <span class="health-val">${wasmOk ? 'Ready' : 'Not Ready'}</span>
    </div>
    <div class="health-row">
      <div class="health-dot ok"></div>
      <span class="health-key">API Handler</span>
      <span class="health-val">Online</span>
    </div>
    <div class="health-row">
      <div class="health-dot ok"></div>
      <span class="health-key">HLS Proxy</span>
      <span class="health-val">Active</span>
    </div>
    <div class="health-row">
      <div class="health-dot ok"></div>
      <span class="health-key">TMDB Relay</span>
      <span class="health-val">${d.tmdbHits || 0} calls</span>
    </div>
    <div class="health-row">
      <div class="health-dot ${parseInt(d.errors || 0) === 0 ? 'ok' : 'warn'}"></div>
      <span class="health-key">Error Count</span>
      <span class="health-val">${d.errors || 0}</span>
    </div>
  `;
}

fetchAndRender();
setInterval(fetchAndRender, 5000);
</script>
</body>
</html>
